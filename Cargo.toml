# K4 Remote — Cargo workspace.
# Layering per docs/concept/architecture.md (NFR-MAINT-01): the protocol core
# (k4-protocol) has no UI or audio dependency. Heavy deps (iced, tokio, opus,
# cpal) are added per-crate as their phase begins — kept out of the first scaffold.
[workspace]
resolver = "2"
members = [
    "crates/k4-protocol",
    "crates/k4-transport",
    "crates/k4-stream",
    "crates/k4-session",
    "crates/k4-audio",
    "crates/k4-sim",
    "crates/k4-config",
    "crates/k4-diag",
    "crates/k4-kpod",
    "crates/k4-kpa",
    "crates/k4-spot",
    "crates/k4-catsrv",
    "app",
    "xtask",
]
# Patched copies of dependencies, not ours to lint or test: see vendor/README.md.
exclude = ["vendor"]

[workspace.package]
edition = "2021"
version = "0.10.0"
authors = ["Simon Keimer (DC0SK)"]
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/dc0sk/K4remote"

[workspace.dependencies]
sha2 = "0.10"

# Two iced 0.13 crates, each with one upstream fix the CPU renderer needs (see vendor/README.md).
[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
